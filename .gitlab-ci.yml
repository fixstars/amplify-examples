workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH || $CI_COMMIT_TAG"

stages:
  - prepare
  - test
  - format
  - output
  - push

.python-base:
  image: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
  tags:
    - docker
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .venv
  before_script:
    - uv sync

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  BASE_PYTHON_VER: "3.10"
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_CONCURRENT_DOWNLOADS: 4
  UV_CONCURRENT_INSTALLS: 4

.git-scripts:
  setup-config:
    - git remote set-url origin https://gitlab-ci-token:$GITLAB_API_ACCESS_TOKEN@${CI_REPOSITORY_URL##*@}
    - git config user.email "noreply@fixstars.com"
    - git config user.name "GitLab Bot"

  checkout-current:
    - git fetch origin $CI_COMMIT_REF_NAME
    - git switch -C $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME
    - git clean -xfd

build docker:
  stage: prepare
  resource_group: docker build
  tags:
    - shell
    - epyc128
  script:
    - docker system prune -f --filter "until=720h" --filter "label=repository=${CI_PROJECT_URL}"
    - docker buildx build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG} -f Dockerfile_dev .

execute changes:
  extends: .python-base
  stage: test
  tags:
    - docker
    - epyc128
  variables:
    GIT_DEPTH: 0
    GIT_FETCH_EXTRA_FLAGS: --filter=blob:none
  script:
    - |-
      git cat-file -e "${CI_MERGE_REQUEST_DIFF_BASE_SHA}^{commit}" \
          || { echo "base commit not found: '$CI_MERGE_REQUEST_DIFF_BASE_SHA'" 1>&2; exit 1; }
      NBPATHS=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | grep '.ipynb' | grep -v 'demo' || true)
      for NBPATH in $NBPATHS; do
          if [ ! -f "$NBPATH" ]; then
              continue
          fi
          ./run-notebook.sh "$NBPATH" || FAILED="$FAILED $NBPATH"
      done
    - |-
      if [ -n "$FAILED" ]; then
          echo "[execute changes] failed notebooks:$FAILED" 1>&2
          exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - notebooks/**/*.ipynb

execute all:
  extends: .python-base
  stage: test
  tags:
    - docker
    - epyc128
  script:
    - |-
      for NBPATH in $(/bin/ls -1 notebooks/{en,ja}/{tutorials,examples}/*.ipynb); do
          ./run-notebook.sh "$NBPATH" || FAILED="$FAILED $NBPATH"
      done
    - |-
      if [ -n "$FAILED" ]; then
          echo "[execute all] failed notebooks:$FAILED" 1>&2
          exit 1
      fi
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - notebooks/**/*.ipynb
      when: on_success
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: true

format:
  extends: .python-base
  stage: format
  resource_group: git-push
  tags:
    - docker
    - epyc128
  script:
    - !reference [.git-scripts, setup-config]
    - !reference [.git-scripts, checkout-current]
    - uv run ./format.sh
    - git add -u
    - |-
      if [ $(git status -s -uno --ignore-submodules=all | wc -l) -gt 0 ]; then
          git commit -m "🎨 Format"
          git push origin HEAD:$CI_COMMIT_REF_NAME
          exit 1
      fi
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

html:
  extends: .python-base
  stage: output
  resource_group: git-push
  tags:
    - docker
    - epyc128
  script:
    - !reference [.git-scripts, setup-config]
    - !reference [.git-scripts, checkout-current]
    - uv run ./make-html.sh
    - git add -A html/
    - |-
      if [ $(git status -s -uno --ignore-submodules=all | wc -l) -gt 0 ]; then
          git commit -m "📝 Update html files"
          git push origin HEAD:$CI_COMMIT_REF_NAME
          exit 1
      fi
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

sync-repositories:
  stage: push
  tags:
    - docker
  image: bitnami/git
  resource_group: git-push
  script:
    # prepare remote repositories
    - !reference [.git-scripts, setup-config]
    - git config remote.github.url >&- && git remote set-url github https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/fixstars/amplify-examples.git || git remote add github https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/fixstars/amplify-examples.git
    - git fetch github main
    - git fetch origin main develop
    - git switch -C develop origin/develop
    - git clean -xfd
    # rebase and push
    - git status
    - git rebase github/main
    - git push origin develop
    - git push origin develop:main
    - git push github develop:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
